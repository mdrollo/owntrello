name: Build & Deploy

# Bei jedem Push auf main: testen, Container-Image bauen, in die Azure
# Container Registry schieben und auf Azure App Service ausrollen.
#
# Anmeldung bei Azure per OpenID Connect – es gibt keine Secrets im Repo.
# Die nötigen Werte stehen als Repository-Variablen (Settings → Secrets and
# variables → Actions → Variables), angelegt von scripts/azure-setup.sh:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_ACR, AZURE_WEBAPP_NAME
# Solange AZURE_ACR fehlt, laufen nur die Tests.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'scripts/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: ${{ vars.AZURE_ACR != '' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # für die OIDC-Anmeldung bei Azure
      contents: read
    env:
      IMAGE: ${{ vars.AZURE_ACR }}/owntrello:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bei der Container Registry anmelden
        run: az acr login --name "${AZURE_ACR%%.*}"
        env:
          AZURE_ACR: ${{ vars.AZURE_ACR }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ vars.AZURE_ACR }}/owntrello:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE }}
